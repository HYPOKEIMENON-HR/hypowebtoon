<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히포 교육 웹툰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1A2B4A;
    --navy-light: #2D3F5F;
    --blue: #3182F6;
    --blue-light: #EBF3FF;
    --blue-mid: #C5DDF9;
    --gray-50: #F9FAFB;
    --gray-100: #F2F4F6;
    --gray-200: #E5E8EB;
    --gray-400: #9EA3AD;
    --gray-600: #6B7280;
    --gray-800: #333D4B;
    --gray-900: #191F28;
    --white: #FFFFFF;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 40px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    width: 32px;
    height: 32px;
    background: var(--navy);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-logo-mark svg { width: 18px; height: 18px; }
  .nav-logo-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -0.3px;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    list-style: none;
  }
  .nav-links a {
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    transition: background 0.15s, color 0.15s;
  }
  .nav-links a:hover { background: var(--gray-100); color: var(--gray-900); }
  .nav-links a.active { color: var(--blue); background: var(--blue-light); }

  /* HERO */
  .hero {
    background: var(--navy);
    padding: 80px 40px 72px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(49,130,246,0.18) 0%, transparent 70%);
    top: -200px; right: -100px;
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(49,130,246,0.10) 0%, transparent 70%);
    bottom: -150px; left: 50px;
    pointer-events: none;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(49,130,246,0.2);
    color: #7FB8FF;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .hero-eyebrow span { width: 6px; height: 6px; background: #7FB8FF; border-radius: 50%; display: inline-block; }
  .hero h1 {
    font-size: 44px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -1.2px;
    line-height: 1.2;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero h1 em {
    font-style: normal;
    color: #7FB8FF;
  }
  .hero-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    max-width: 440px;
    margin: 0 auto 36px;
    position: relative;
    z-index: 1;
  }
  .hero-stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    position: relative;
    z-index: 1;
  }
  .hero-stat { text-align: center; }
  .hero-stat-num {
    display: block;
    font-size: 28px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }
  .hero-stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .hero-stat-divider {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.15);
  }

  /* FILTER TABS */
  .filter-section {
    padding: 32px 40px 0;
  }
  .filter-tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--gray-200);
    padding-bottom: 0;
  }
  .tab-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    background: none;
    border: none;
    padding: 10px 16px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s;
    margin-bottom: -1px;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--gray-900); }
  .tab-btn.active {
    color: var(--blue);
    border-bottom-color: var(--blue);
    font-weight: 600;
  }
  .tab-count {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    background: var(--gray-200);
    color: var(--gray-600);
    padding: 1px 7px;
    border-radius: 100px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .tab-btn.active .tab-count {
    background: var(--blue-light);
    color: var(--blue);
  }

  /* GRID */
  .grid-section {
    padding: 28px 40px 60px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--gray-900);
  }
  .section-count {
    font-size: 13px;
    color: var(--gray-400);
  }

  .webtoon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .webtoon-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--gray-200);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  }
  .webtoon-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    border-color: var(--blue-mid);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    position: relative;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .webtoon-card:hover .card-thumb img { transform: scale(1.04); }

  .card-thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .card-thumb-placeholder .ep-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0.5;
  }
  .card-thumb-placeholder .ep-title-mini {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 0 12px;
    opacity: 0.8;
  }

  /* placeholder bg colors per series */
  .bg-life { background: linear-gradient(160deg, #EBF3FF 0%, #C5DDF9 100%); }
  .bg-work { background: linear-gradient(160deg, #EBF3FE 0%, #D6EDFF 50%, #B8D9F7 100%); }
  .bg-knowledge { background: linear-gradient(160deg, #E8F5FF 0%, #CCE7FF 100%); }

  .card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
  }
  .badge-life { background: rgba(49,130,246,0.15); color: #1A6FD4; }
  .badge-work { background: rgba(26,43,74,0.12); color: #1A2B4A; }
  .badge-knowledge { background: rgba(16,159,125,0.12); color: #0D7A60; }
  .badge-new {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #FF4D4D;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 100px;
    letter-spacing: 0.3px;
  }

  .card-body {
    padding: 14px 16px 16px;
  }
  .card-series {
    font-size: 11px;
    color: var(--gray-400);
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-900);
    line-height: 1.45;
    margin-bottom: 10px;
    word-break: keep-all;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-ep {
    font-size: 12px;
    color: var(--gray-400);
    font-weight: 500;
  }
  .card-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--gray-100);
    color: var(--gray-600);
  }

  /* HIPO MASCOT ILLUSTRATION (placeholder) */
  .hipo-icon {
    width: 48px;
    height: 48px;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  /* FOOTER */
  footer {
    background: var(--white);
    border-top: 1px solid var(--gray-200);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-brand {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-400);
    letter-spacing: -0.2px;
  }
  .footer-note {
    font-size: 12px;
    color: var(--gray-400);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    border-radius: var(--radius-xl);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 18px; right: 18px;
    width: 32px; height: 32px;
    background: var(--gray-100);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    color: var(--gray-600);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--gray-200); }
  .modal-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 12px;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--gray-900);
    margin-bottom: 8px;
    line-height: 1.35;
    word-break: keep-all;
  }
  .modal-desc {
    font-size: 14px;
    color: var(--gray-600);
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .modal-thumb {
    width: 100%;
    aspect-ratio: 3/2;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 48px;
  }
  .modal-info-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .modal-tag {
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--gray-100);
    color: var(--gray-600);
  }
  .modal-btn {
    width: 100%;
    padding: 14px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-btn:hover { background: #1A6FD4; }

  @media (max-width: 640px) {
    nav { padding: 0 20px; }
    .hero { padding: 60px 20px 56px; }
    .hero h1 { font-size: 30px; }
    .filter-section { padding: 24px 20px 0; }
    .grid-section { padding: 20px 20px 48px; }
    .webtoon-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    footer { padding: 20px; flex-direction: column; gap: 8px; text-align: center; }
  }

  /* ADMIN */
  .admin-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    background: var(--navy);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0.4;
    transition: opacity 0.2s;
  }
  .admin-btn:hover { opacity: 1; }
  .admin-btn svg { width: 20px; height: 20px; }

  .admin-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 400;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
    overflow-y: auto;
  }
  .admin-overlay.open { display: flex; }

  .admin-panel {
    background: var(--white);
    border-radius: var(--radius-xl);
    width: 100%;
    max-width: 640px;
    padding: 28px;
    position: relative;
    margin: auto;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .admin-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -0.4px;
  }
  .admin-close {
    width: 32px; height: 32px;
    background: var(--gray-100);
    border: none; border-radius: 50%;
    cursor: pointer; font-size: 16px;
    color: var(--gray-600);
    display: flex; align-items: center; justify-content: center;
  }
  .admin-close:hover { background: var(--gray-200); }

  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form input {
    font-family: inherit;
    font-size: 15px;
    padding: 12px 16px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    outline: none;
    color: var(--gray-900);
  }
  .login-form input:focus { border-color: var(--blue); }
  .login-submit {
    padding: 13px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .login-submit:hover { background: var(--navy-light); }
  .login-error {
    font-size: 13px;
    color: #E53E3E;
    text-align: center;
    display: none;
  }

  .admin-content { display: none; }
  .admin-content.visible { display: block; }

  .admin-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .admin-tab {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--gray-200);
    background: none;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.15s;
  }
  .admin-tab.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }

  .ep-edit-card {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 12px;
  }
  .ep-edit-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .ep-edit-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-900);
  }
  .ep-edit-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 100px;
    font-weight: 500;
  }
  .ep-field { margin-bottom: 10px; }
  .ep-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-600);
    margin-bottom: 4px;
  }
  .ep-field input, .ep-field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    outline: none;
    color: var(--gray-900);
    background: white;
    resize: vertical;
  }
  .ep-field input:focus, .ep-field textarea:focus { border-color: var(--blue); }

  .admin-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-save {
    flex: 1;
    padding: 13px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: #1A6FD4; }
  .btn-export {
    flex: 1;
    padding: 13px;
    background: none;
    color: var(--gray-800);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-export:hover { background: var(--gray-100); }
  .save-toast {
    position: fixed;
    bottom: 80px;
    right: 24px;
    background: var(--gray-900);
    color: white;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 100px;
    z-index: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .save-toast.show { opacity: 1; transform: translateY(0); }


  /* VIEWER */
  .viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    z-index: 350;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }
  .viewer-overlay.open { display: flex; }

  .viewer-header {
    position: sticky;
    top: 0;
    width: 100%;
    background: rgba(17,17,17,0.95);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .viewer-back {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
  }
  .viewer-back:hover { color: white; background: rgba(255,255,255,0.08); }
  .viewer-back svg { width: 18px; height: 18px; }
  .viewer-title-wrap { text-align: center; }
  .viewer-series {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .viewer-ep-title {
    font-size: 14px;
    font-weight: 600;
    color: white;
    letter-spacing: -0.3px;
  }
  .viewer-spacer { width: 80px; }

  .viewer-body {
    width: 100%;
    max-width: 720px;
    padding: 0 0 80px;
  }
  .viewer-cut {
    width: 100%;
    display: block;
  }
  .viewer-cut img {
    width: 100%;
    display: block;
  }

  .viewer-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    gap: 12px;
  }
  .viewer-empty svg { width: 48px; height: 48px; opacity: 0.3; }
  .viewer-empty p { font-size: 15px; font-weight: 500; }
  .viewer-empty span { font-size: 13px; opacity: 0.6; }

  .viewer-end {
    text-align: center;
    padding: 40px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin-top: 8px;
  }
  .viewer-end p {
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
  }
  .viewer-end-btn {
    display: inline-block;
    padding: 10px 24px;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    border: none;
    border-radius: 100px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

  { id:3, series:'life', seriesLabel:'생활수칙', ep:'EP.03', title:'메신저 예절, 이렇게 쓰세요', tag:'커뮤니케이션', isNew:false,
    desc:'팀즈·슬랙 등 사내 메신저를 올바르게 쓰는 법. 호칭, 응답 속도, 이모지 사용 기준까지.', keywords:['메신저','호칭','응답 속도'], pages:[] },
  { id:4, series:'life', seriesLabel:'생활수칙', ep:'EP.04', title:'연차와 반차, 이렇게 신청해요', tag:'근태 관리', isNew:true,
    desc:'연차 신청 방법과 반차 규정, 급하게 쉬어야 할 때 어떻게 하는지까지 히포와 함께 알아봐요.', keywords:['연차','반차','근태'], pages:[] },
  { id:5, series:'work', seriesLabel:'업무수칙', ep:'EP.01', title:'일 잘하는 사람들의 업무 기본기', tag:'업무 기본', isNew:false,

    desc:'보고, 소통, 기록, 기본 — 일 잘하는 사람들이 공통으로 갖춘 네 가지 업무 습관을 히포와 함께 알아봐요.', keywords:['보고서','두괄식','수치화'], pages:[] },
  { id:6, series:'work', seriesLabel:'업무수칙', ep:'EP.02', title:'함께 일하는 법 — 협업의 기본기', tag:'협업', isNew:false,
    thumb:'',
    desc:'회의, 공유, 피드백, 일정조율 — 혼자가 아닌 팀으로 일할 때 꼭 알아야 할 협업 습관을 히포와 함께 배워봐요.', keywords:['회의','피드백','협업'], pages:[] },
  { id:7, series:'work', seriesLabel:'업무수칙', ep:'EP.03', title:'마감을 지키는 사람들의 공통점', tag:'시간 관리', isNew:false,

    thumb:'',
    desc:'기본급, 수당, 공제 항목까지. 급여명세서를 처음 받았을 때 이해하기 어려웠던 그것, 히포가 알려드려요.', keywords:['기본급','수당','공제'], pages:[] },
  { id:10, series:'knowledge', seriesLabel:'지식', ep:'EP.02', title:'근로계약서, 뭘 확인해야 할까?', tag:'근로계약', isNew:false,

  { id:11, series:'knowledge', seriesLabel:'지식', ep:'EP.03', title:'퇴직금은 언제, 얼마나 받나요?', tag:'퇴직금', isNew:true,
    desc:'퇴직금 계산 방식과 지급 기준. 1년 이상 근무했을 때 내가 받을 수 있는 금액을 알아봐요.', keywords:['퇴직금','계산','지급 기준'], pages:[] },
  { id:12, series:'knowledge', seriesLabel:'지식', ep:'EP.04', title:'4대 보험, 왜 내는 건가요?', tag:'4대 보험', isNew:true,
    desc:'국민연금, 건강보험, 고용보험, 산재보험. 각각의 역할과 내가 내는 금액의 의미를 히포가 설명해드려요.', keywords:['4대 보험','국민연금','건강보험'], pages:[] },
];

const bgMap = { life:'bg-life', work:'bg-work', knowledge:'bg-knowledge' };
const badgeMap = { life:'badge-life', work:'badge-work', knowledge:'badge-knowledge' };
const colorMap = {
  life: { badge:'#1A6FD4', badgeBg:'rgba(49,130,246,0.12)', thumb:'linear-gradient(160deg,#EBF3FF,#C5DDF9)', emoji:'🏢' },
  work: { badge:'#1A2B4A', badgeBg:'rgba(26,43,74,0.10)', thumb:'linear-gradient(160deg,#EBF3FE,#B8D9F7)', emoji:'💼' },
  knowledge: { badge:'#0D7A60', badgeBg:'rgba(16,159,125,0.10)', thumb:'linear-gradient(160deg,#E8F5FF,#CCE7FF)', emoji:'📚' },
};

function renderCards(list) {
  const grid = document.getElementById('webtoon-grid');
  grid.innerHTML = list.map(w => {
    const c = colorMap[w.series];
    return `
    <div class="webtoon-card" onclick="openModal(${w.id})">
      <div class="card-thumb">
        ${w.thumb
          ? `<img src="${w.thumb}" alt="${w.title}" style="width:100%;height:100%;object-fit:cover;display:block;">`
          : `<div class="card-thumb-placeholder ${bgMap[w.series]}">
          <div style="font-size:36px;margin-bottom:4px;">${c.emoji}</div>
          <div class="ep-num">${w.ep}</div>
          <div class="ep-title-mini" style="color:var(--gray-800);">${w.tag}</div>
        </div>`
        }
        <span class="card-badge ${badgeMap[w.series]}">${w.seriesLabel}</span>
        ${w.isNew ? '<span class="badge-new">NEW</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-series">${w.seriesLabel} · ${w.ep}</div>
        <div class="card-title">${w.title}</div>
        <div class="card-meta">
          <span class="card-ep">${w.ep}</span>
          <span class="card-tag">${w.tag}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterCards(type, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = type === 'all' ? webtoons : webtoons.filter(w => w.series === type);
  renderCards(filtered);
  const labels = { all:'전체 웹툰', life:'생활수칙', work:'업무수칙', knowledge:'지식' };
  document.getElementById('section-title').textContent = labels[type];
  document.getElementById('section-count').textContent = filtered.length + '편';
}

function openModal(id) {
  const w = webtoons.find(x => x.id === id);
  const c = colorMap[w.series];
  document.getElementById('modal-content').innerHTML = `
    ${w.thumb
      ? `<div class="modal-thumb" style="padding:0;overflow:hidden;border-radius:var(--radius-md);">
          <img src="${w.thumb}" alt="${w.title}" style="width:100%;height:100%;object-fit:cover;">
         </div>`
      : `<div class="modal-thumb" style="background:${c.thumb};">
          <span style="font-size:56px;">${c.emoji}</span>
         </div>`
    }
    <span class="modal-badge" style="background:${c.badgeBg};color:${c.badge};">${w.seriesLabel} · ${w.ep}</span>
    <div class="modal-title">${w.title}</div>
    <div class="modal-desc">${w.desc}</div>
    <div class="modal-info-row">
      ${w.keywords.map(k => `<span class="modal-tag">#${k}</span>`).join('')}
    </div>
    <button class="modal-btn" onclick="openViewer(w.id); document.getElementById('modal-overlay').classList.remove('open');">웹툰 보기 →</button>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

renderCards(webtoons);
</script>

        <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다.</div>
      </div>
    </div>

      <div class="admin-tabs" id="admin-tabs"></div>

        <button class="btn-save" onclick="saveChanges()">✓ 변경사항 저장</button>
        <button class="btn-export" onclick="exportJSON()">↓ JSON 내보내기</button>
      </div>
    </div>
  </div>
</div>

<script>
const ADMIN_PW = 'hypo2024!';

function openAdmin() {
  document.getElementById('admin-overlay').classList.add('open');
  document.getElementById('admin-pw').value = '';
  document.getElementById('login-error').style.display = 'none';
}
function closeAdmin() {
  document.getElementById('admin-overlay').classList.remove('open');
}
document.getElementById('admin-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeAdmin();
});

function doLogin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === ADMIN_PW) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-title').textContent = '웹툰 관리자 패널';
    document.getElementById('admin-content').classList.add('visible');
    renderAdminTabs('all');
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

const seriesInfo = {
  all: { label: '전체', badge: '' },
  life: { label: '생활수칙', color: '#1A6FD4', bg: 'rgba(49,130,246,0.12)' },
  work: { label: '업무수칙', color: '#1A2B4A', bg: 'rgba(26,43,74,0.10)' },
  knowledge: { label: '지식', color: '#0D7A60', bg: 'rgba(16,159,125,0.10)' },
};

let currentTab = 'all';

function renderAdminTabs(tab) {
  currentTab = tab;
  const tabs = document.getElementById('admin-tabs');
  tabs.innerHTML = ['all','life','work','knowledge'].map(t =>
    `<button class="admin-tab ${tab===t?'active':''}" onclick="renderAdminTabs('${t}')">${seriesInfo[t].label}</button>`
  ).join('');

  const list = document.getElementById('admin-ep-list');
  const filtered = tab === 'all' ? webtoons : webtoons.filter(w => w.series === tab);
  const si = seriesInfo;

  list.innerHTML = filtered.map(w => {
    const s = si[w.series];
    return `
    <div class="ep-edit-card">
      <div class="ep-edit-card-header">
        <span class="ep-edit-label">${w.seriesLabel} ${w.ep}</span>
        <span class="ep-edit-badge" style="background:${s.bg};color:${s.color};">${w.tag}</span>
      </div>
      <div class="ep-field">
        <label>제목</label>
        <input type="text" id="title-${w.id}" value="${w.title}"/>
      </div>
      <div class="ep-field">
        <label>설명</label>
        <textarea id="desc-${w.id}" rows="2">${w.desc}</textarea>
      </div>
      <div class="ep-field">
        <label>썸네일 URL (Cloudinary)</label>
        <input type="text" id="thumb-${w.id}" value="${w.thumb && !w.thumb.startsWith('data:') ? w.thumb : ''}" placeholder="https://res.cloudinary.com/..."/>
      </div>
      <div class="ep-field">
        <label>태그</label>
        <input type="text" id="tag-${w.id}" value="${w.tag}"/>
      </div>
      <div class="ep-field">
        <label>웹툰 컷 URL 목록 (한 줄에 하나씩, Cloudinary URL)</label>
        <textarea id="pages-${w.id}" rows="4" placeholder="https://res.cloudinary.com/.../cut1.jpg&#10;https://res.cloudinary.com/.../cut2.jpg">${(w.pages||[]).join('\n')}</textarea>
      </div>
    </div>`;
  }).join('');
}

function saveChanges() {
  webtoons.forEach(w => {
    const titleEl = document.getElementById('title-' + w.id);
    const descEl = document.getElementById('desc-' + w.id);
    const thumbEl = document.getElementById('thumb-' + w.id);
    const tagEl = document.getElementById('tag-' + w.id);
    if (titleEl) w.title = titleEl.value;
    if (descEl) w.desc = descEl.value;
    if (thumbEl && thumbEl.value.trim()) w.thumb = thumbEl.value.trim();
    if (tagEl) w.tag = tagEl.value;
    const pagesEl = document.getElementById('pages-' + w.id);
    if (pagesEl) w.pages = pagesEl.value.split('\n').map(s=>s.trim()).filter(Boolean);
  });
  renderCards(webtoons.filter(w => currentTab === 'all' || w.series === currentTab));
  renderAdminTabs(currentTab);

  const toast = document.getElementById('save-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}


function openViewer(id) {
  const w = webtoons.find(x => x.id === id);
  document.getElementById('viewer-series-label').textContent = w.seriesLabel + ' · ' + w.ep;
  document.getElementById('viewer-ep-title').textContent = w.title;

  const body = document.getElementById('viewer-body');
  if (!w.pages || w.pages.length === 0) {
    body.innerHTML = `
      <div class="viewer-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        <p>아직 업로드된 웹툰이 없어요</p>
        <span>관리자 패널에서 컷 이미지를 추가해주세요</span>
      </div>`;
  } else {
    body.innerHTML = w.pages.map((url, i) =>
      `<div class="viewer-cut"><img src="${url}" alt="${w.title} ${i+1}컷" loading="lazy"/></div>`
    ).join('') + `
    <div class="viewer-end">
      <p>— 완 —</p>
      <button class="viewer-end-btn" onclick="closeViewer()">목록으로 돌아가기</button>
    </div>`;
  }

  document.getElementById('viewer-overlay').classList.add('open');
  document.getElementById('viewer-overlay').scrollTop = 0;
}

function closeViewer() {
  document.getElementById('viewer-overlay').classList.remove('open');
}

function exportJSON() {
  const data = webtoons.map(w => ({
    id: w.id,
    series: w.series,
    seriesLabel: w.seriesLabel,
    ep: w.ep,
    title: w.title,
    tag: w.tag,
    isNew: w.isNew,
    thumb: w.thumb && !w.thumb.startsWith('data:') ? w.thumb : '',
    pages: w.pages || [],
    desc: w.desc,
    keywords: w.keywords,
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'webtoons.json';
  a.click();
}
</script>
